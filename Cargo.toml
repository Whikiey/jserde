[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Whikiey/jserde"
homepage = "https://github.com/Whikiey/jserde"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
